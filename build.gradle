// Top-level build file where you can add configuration options common to all sub-projects/modules.
buildscript {
    repositories {
        mavenCentral()
        google()
        maven { url "https://plugins.gradle.org/m2/" }
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.6.1'
        classpath 'com.google.gms:google-services:4.3.15'
//        classpath 'com.huawei.agconnect:agcp:1.9.1.301'
        classpath 'com.google.firebase:firebase-crashlytics-gradle:2.9.0'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:2.1.0"
        classpath "org.jetbrains.kotlin:kotlin-serialization:2.1.0"

        //noinspection GradleDependency
        classpath "io.sentry:sentry-android-gradle-plugin:6.19.0"
        // db
        classpath "io.objectbox:objectbox-gradle-plugin:5.4.2"
    }
}

static String detectNdkVersion() {
    def version = "27.0.12077973"
    def androidHome = System.getenv("ANDROID_HOME") ?: "C:/Users/HP Omnibook X Flip/AppData/Local/Android/Sdk"
    def ndkDir = new File(androidHome, "ndk")
    if (ndkDir.isDirectory()) {
        def dirs = ndkDir.listFiles()
        if (dirs != null && dirs.length > 0) {
            return dirs[0].name
        }
    }
    return version
}

ext {

    ndkVersion = detectNdkVersion()

}

allprojects {
    repositories {
        // The order in which you list these repositories matter.
        mavenCentral()
        google()
    }
}